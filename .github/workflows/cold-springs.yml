name: Cold Springs
on:
  pull_request:
    paths:
      - 'houses/cold-springs/**'
      - '.github/workflows/cold-springs.yml'
  push:
    branches: [main]
    paths:
      - 'houses/cold-springs/**'
      - '.github/workflows/cold-springs.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: houses/cold-springs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
